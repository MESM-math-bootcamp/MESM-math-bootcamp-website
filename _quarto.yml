project:
  type: website
  output-dir: docs

execute:
  freeze: auto  # Re-render only when source changes



website:
  title: "Bren Calculus Workshop"
  favicon: images/favicon.png
  navbar:
    title: "Bren Calculus Workshop"
    right:
      - text: home
        href: index.qmd
      - icon: github
        menu:
          - text: Source code
            url: https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website
          - text: Report a bug
            url: https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website/issues

  sidebar:
    title: "Daily materials"
    style: docked
    contents:
      - text: home
        href: index.qmd
      - text: day 1 - algebra
        href: notes/day1_algebra/day1_algebra.qmd
        contents:
          - text: Problem set
            href: notes/day1_algebra/problem_set_algebra.qmd
          - text: Solutions
            href: notes/day1_algebra/solutions_problem_set_algebra.qmd
      - text: day 2 - limits
        href: notes/day2_limits/day2_limits.qmd
        contents:
          - text: Problem set
            href: notes/day2_limits/problem_set_limits.qmd
          - text: Solutions
            href: notes/day2_limits/solutions_problem_set_limits.qmd
      - text: day 3 - derivatives
        href: notes/day3_derivatives/day3_derivatives.qmd
        contents:
          - text: Problem set
            href: notes/day3_derivatives/problem_set_derivatives.qmd
          - text: Solutions
            href: notes/day3_derivatives/solutions_problem_set_derivative.qmd
      - text: day 4 - integrals
        href: notes/day4_integrals/day4_integrals.qmd
        contents:
          - text: Problem set
            href: notes/day4_integrals/problem_set_integrals.qmd
          - text: Solutions
            href: notes/day4_integrals/solutions_problem_set_integrals.qmd
      - text: day 5 - differential equations
        href: notes/day5_differential_equations/day5_differential_equations.qmd

  page-footer:
    background: dark
    right: This website is built with [{{< fa brands github title="the github octocat logo" >}}](https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website), [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html) and [Quarto](https://quarto.org/)
    left: |
      ![](/images/bren-logo.png){width=250}


format:
  html:
    theme: meds-website-styles.scss
    toc: true
    title-block-banner: true
    page-layout: full

editor: source

