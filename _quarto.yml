project:
  type: website
  output-dir: docs
  render:
     - "*.qmd"
     - "!CLAUDE.md"

execute:
  freeze: auto  # Re-render only when source changes



website:
  title: "Bren Math Workshop"
  favicon: images/favicon.png
  navbar:
    title: "Bren Math Workshop"
    right:
      - text: home
        href: index.qmd
      - icon: github
        menu:
          - text: Source code
            url: https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website
          - text: Report a bug
            url: https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website/issues
  
  announcement: 
    icon: hammer
    dismissable: true
    content: "This wesbite is currently under construction: all slides and problem sets are being reviewed and updated. Please come back on September 16, 2026 for the updated version."
    type: primary
    position: below-navbar

  sidebar:
    id: daily-materials
    title: "Daily materials"
    style: docked
    contents:
      - text: home
        href: index.qmd
      - text: day 1 - algebra review
        href: notes/day1_algebra/day1_algebra.qmd
      - text: day 2 - units and graphs
        href: notes/day2_functions_graphs/day2_functions_graphs.qmd
      - text: day 3 - linear functions, $e^x$ and $log$
        href: notes/day3/day3.qmd
      # - text: day 4 - limits and derivatives
      #   href: notes/day4_integrals/day4_integrals.qmd
      # - text: day 5 - integrals and differential equations
      #   href: notes/day5_differential_equations/day5_differential_equations.qmd

  page-footer:
    background: dark
    right: This website is built with [{{< fa brands github title="the github octocat logo" >}}](https://github.com/MESM-math-bootcamp/MESM-math-bootcamp-website), [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html) and [Quarto](https://quarto.org/)
    left: |
      ![](/images/bren-logo.png){width=250}


format:
  html:
    theme: meds-website-styles.scss
    toc: true
    title-block-banner: true
    page-layout: full

editor: source

link-external-newwindow: True
